services:
  - type: web
    name: wm2026-tippspiel
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FOOTBALL_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: wm2026-db
          property: connectionString

databases:
  - name: wm2026-db
    databaseName: wm2026
    user: wm2026
    plan: free
